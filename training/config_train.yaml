# Data — Roboflow COCO v2 (train/valid/test terpisah)
# images_dir: null → otomatis gunakan folder yang sama dengan JSON (default Roboflow)
train_json:   "C:/Users/user/Downloads/annotation-v1-roboflow.v2i.coco/train/_annotations.coco.json"
val_json:     "C:/Users/user/Downloads/annotation-v1-roboflow.v2i.coco/valid/_annotations.coco.json"
test_json:    "C:/Users/user/Downloads/annotation-v1-roboflow.v2i.coco/test/_annotations.coco.json"
images_dir:   null             # null = otomatis dari folder JSON (Roboflow style)
num_classes:  3                # background + daun kelengkeng + daun kelengkeng itoh

# Model
backbone:     resnet101        # resnet50 | resnet101
pretrained_backbone: true
aspp_rates:   [6, 12, 18, 24]
aspp_out_channels: 256
trainable_backbone_layers: 3
use_boundary_head: true

# Training
epochs:       50
batch_size:   2
num_workers:  4
image_size:   512              # resize ke 512×512

# Augmentasi
mosaic_prob:  0.3              # probabilitas mosaic augmentation per sample

# Normalisasi (Z-score / ImageNet stats)
normalize_mean: [0.485, 0.456, 0.406]
normalize_std:  [0.229, 0.224, 0.225]

# Optimizer
optimizer:    adam
lr:           0.0001           # 1e-4
weight_decay: 0.0001           # 1e-4

# LR Schedule
lr_scheduler: cosine           # CosineAnnealingLR
lr_min:       0.000001         # 1e-6

# Combined Loss
loss_weights:
  focal:    1.0
  dice:     1.0
  boundary: 1.0

# Checkpoint (berdasarkan val BF Score)
checkpoint_dir: checkpoints/
save_every:   5                # simpan tiap N epoch
resume:       null             # null | path ke checkpoint

# Logging
tensorboard_dir: runs/
log_every:    20               # log setiap N iterasi

# Oklusi
# Threshold untuk klasifikasi: rendah < low_thresh <= sedang < high_thresh <= tinggi
occlusion_thresholds: [0.15, 0.40]
# occlusion_filter: null = gunakan semua data
# occlusion_filter: rendah | sedang | tinggi = filter hanya gambar dengan level tersebut
occlusion_filter: null
# Cetak statistik oklusi sebelum training dimulai
occlusion_stats: true
