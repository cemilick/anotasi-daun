# ══════════════════════════════════════════════════════════════════════════════
# Config Training Utama — Prop-DeOccNet (Kaggle / GPU Server)
# Target: ResNet-101 + ASPP [6,12,18,24] + BoundaryAttentionHead
# ══════════════════════════════════════════════════════════════════════════════

# Data — Roboflow COCO v2 (train/valid/test terpisah)
train_json:   "/kaggle/input/daun-kelengkeng-itoh/train/_annotations.coco.json"
val_json:     "/kaggle/input/daun-kelengkeng-itoh/valid/_annotations.coco.json"
test_json:    "/kaggle/input/daun-kelengkeng-itoh/test/_annotations.coco.json"
images_dir:   null             # null = otomatis dari folder JSON (Roboflow style)
num_classes:  2                # background + daun (binary: bg vs daun itoh)

# ── Model ──────────────────────────────────────────────────────────────────────
backbone:     resnet101        # resnet50 | resnet101 (ResNet-101 untuk tesis utama)
pretrained_backbone: true      # pretrained ImageNet → transfer learning
aspp_rates:   [6, 12, 18, 24] # Dilation rates: sesuai DeepLabV2 paper (Chen 2016)
aspp_out_channels: 256
# OPTIMASI: naikkan dari 3 ke 5 → full fine-tuning backbone untuk dataset kecil
trainable_backbone_layers: 5
use_boundary_head: true        # Komponen kunci Prop-DeOccNet (ablasi di config_ablation_*.yaml)

# ── Training ──────────────────────────────────────────────────────────────────
epochs:       80               # Naikkan dari 50 → 80 untuk konvergensi penuh
batch_size:   4                # T4×2: bisa sampai 4 dengan AMP
num_workers:  4
image_size:   512              # 512×512 sesuai paper DeepLab

# ── Augmentasi ────────────────────────────────────────────────────────────────
# Mosaic: simulasi kanopi padat (kontribusi unik Prop-DeOccNet vs DeepLabV2)
mosaic_prob:  0.4              # Naikkan dari 0.3 → 0.4 (lebih banyak variasi oklusi)

# ── Normalisasi (ImageNet stats) ──────────────────────────────────────────────
normalize_mean: [0.485, 0.456, 0.406]
normalize_std:  [0.229, 0.224, 0.225]

# ── Optimizer ─────────────────────────────────────────────────────────────────
# SGD + momentum lebih stabil untuk fine-tuning backbone daripada Adam
# Referensi: DeepLab paper menggunakan SGD dengan poly-LR
optimizer:    adam             # adam | sgd
lr:           0.0001           # 1e-4 (mulai dari sini)
weight_decay: 0.0005           # Naikkan dari 1e-4 → 5e-4 (regularisasi lebih kuat)

# ── LR Schedule ───────────────────────────────────────────────────────────────
lr_scheduler: cosine           # CosineAnnealingLR — smooth decay
lr_min:       0.000001         # 1e-6

# ── Combined Loss ─────────────────────────────────────────────────────────────
# Naikkan bobot boundary → model lebih fokus pada presisi batas daun (BF Score)
loss_weights:
  focal:    1.0
  dice:     1.0
  boundary: 2.0                # OPTIMASI: naikkan dari 1.0 → 2.0 untuk BF Score lebih tinggi

# ── Checkpoint (berdasarkan val BF Score) ────────────────────────────────────
checkpoint_dir: checkpoints/
# OPTIMASI: simpan tiap 10 epoch (bukan 5) → kurangi I/O dan storage ~800MB×file
save_every:   10
resume:       null             # null | path ke checkpoint

# ── Logging ───────────────────────────────────────────────────────────────────
tensorboard_dir: runs/
log_every:    20               # log setiap N iterasi

# ── Oklusi ────────────────────────────────────────────────────────────────────
# Threshold untuk klasifikasi: rendah < low_thresh <= sedang < high_thresh <= tinggi
occlusion_thresholds: null    # null = auto dari persentil ke-33 & ke-67 training set
occlusion_filter: null         # null = semua | rendah | sedang | tinggi
# Cetak statistik oklusi sebelum training dimulai (kontribusi dataset ke tesis)
occlusion_stats: true
