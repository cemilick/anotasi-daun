# Data
train_json:   output/coco/train.json
val_json:     output/coco/val.json
test_json:    output/coco/test.json
images_dir:   images/
num_classes:  2                # 1 kelas + background

# Dataset split (dari annotations/split.json — stratified 70/10/20)
split_stratified: true
split_seed:   42

# Model
backbone:     resnet101        # resnet50 | resnet101
pretrained_backbone: true
aspp_rates:   [6, 12, 18, 24]
aspp_out_channels: 256
trainable_backbone_layers: 3
use_boundary_head: true

# Training
epochs:       50
batch_size:   2
num_workers:  4
image_size:   512              # resize ke 512×512

# Augmentasi
mosaic_prob:  0.3              # probabilitas mosaic augmentation per sample

# Normalisasi (Z-score / ImageNet stats)
normalize_mean: [0.485, 0.456, 0.406]
normalize_std:  [0.229, 0.224, 0.225]

# Optimizer
optimizer:    adam
lr:           0.0001           # 1e-4
weight_decay: 0.0001           # 1e-4

# LR Schedule
lr_scheduler: cosine           # CosineAnnealingLR
lr_min:       0.000001         # 1e-6

# Combined Loss
loss_weights:
  focal:    1.0
  dice:     1.0
  boundary: 1.0

# Checkpoint (berdasarkan val BF Score)
checkpoint_dir: checkpoints/
save_every:   5                # simpan tiap N epoch
resume:       null             # null | path ke checkpoint

# Logging
tensorboard_dir: runs/
log_every:    20               # log setiap N iterasi

# Oklusi filter (dari field occlusion_level di COCO JSON Phase 1)
# null = gunakan semua data
occlusion_filter: null         # null | "rendah" | "sedang" | "tinggi"
